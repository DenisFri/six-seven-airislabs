# Airis Core phase 1: one CNPG Cluster, primary + one streaming replica.
# Apply from the bastion: kubectl apply -f airis-core.yaml (namespace first, then the Cluster).
apiVersion: v1
kind: Namespace
metadata:
  name: airis-core
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: airis-core
  namespace: airis-core
spec:
  instances: 2
  # No imageName: operator 1.30.1 pulls the PostgreSQL 18 image it was released with.
  # Pin it on site only after `kubectl cnpg status` has shown the tag, so a pin can never miss.

  bootstrap:
    initdb:
      database: airis
      owner: airis   # password generated by the operator into Secret airis-core-app
  # enableSuperuserAccess stays false (default): no postgres password exists anywhere.
  # Superuser only from inside a pod: kubectl cnpg psql airis-core

  # Explicit so the scheduler reserves it and the kernel caps it (trap: e2-medium -> OOMKilled).
  # memory limit == request: no overcommit. No CPU limit on purpose: throttling on a
  # 2-vCPU node hurts more than it protects.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 1Gi

  postgresql:
    parameters:
      shared_buffers: "256MB"   # ~25% of the memory limit
      max_connections: "100"

  # These are the defaults, written out because they are the HA story: today both pods
  # share the only node; the moment a second node joins, the replica moves there.
  # "required" would leave the replica Pending on a single node.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

  # local-path = a folder on the node's disk, so the volume is node-bound. Data safety
  # comes from streaming replication, not from the volume. HA path: a CSI class (GCE PD).
  storage:
    storageClass: local-path
    size: 5Gi

  primaryUpdateStrategy: unsupervised   # minor upgrades: replicas first, then automatic switchover

  # Day 2, not today:
  # backup:   WAL archiving + base backups to a GCS bucket via the barman-cloud plugin
  #           (ObjectStore resource + `plugins:` stanza), then scheduled Backup resources.
  # monitoring:
  #   enablePodMonitor: true   # once the Prometheus Operator exists in the cluster
